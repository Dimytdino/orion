name: CI — Front

on:
  push:
    branches: ["master", "migration/**", "feat/**", "fix/**"]
    paths:
      - "front/**"
      - ".github/workflows/ci-front.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "front/**"
      - ".github/workflows/ci-front.yml"

jobs:
  lint-and-build:
    name: Lint + Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: front/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests (Vitest)
        run: npm test

      - name: Build (Vite)
        run: npm run build
